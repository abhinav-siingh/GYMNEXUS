# ===== Server =====
server.port=8080

# ===== MySQL Database =====
# Database: gymnexus_db
# Username and password are loaded from environment variables.
spring.datasource.url=jdbc:mysql://localhost:3306/gymnexus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS}

# ===== JPA / Hibernate =====
# Automatically creates/updates tables from entity classes during development.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# JWT secret is loaded from an environment variable.
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000